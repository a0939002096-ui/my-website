<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 網頁槍戰遊戲 - 敵人 AI 與 HP 版</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    /* 準心 */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      margin-top: -4px;
      margin-left: -4px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid rgba(0, 0, 0, 0.5);
    }
    /* 啟動與 Game Over 遮罩頁面 */
    #instructions {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 15, 20, 0.85);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 10;
    }
    #instructions h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }
    /* 抬頭顯示器 (HUD) */
    #hud {
      position: absolute;
      bottom: 25px;
      left: 25px;
      color: white;
      font-size: 22px;
      font-weight: bold;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .hp-text { color: #ff4757; margin-right: 15px; }
    .score-text { color: #2ed573; }
    
    /* 玩家受傷時螢幕紅光閃爍效果 */
    #damage-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 0, 0, 0.3);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease-out;
      z-index: 5;
    }
  </style>
  <!-- 引入 Three.js 核心與 PointerLockControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>
  <div id="damage-overlay"></div>
  
  <div id="hud">
    <span class="hp-text">HP: <span id="hp">100</span></span>
    <span class="score-text">擊殺數: <span id="score">0</span></span>
  </div>
  
  <div id="instructions">
    <h1 id="title-text">點擊畫面開始遊戲</h1>
    <p id="sub-text">【WASD】移動 | 【滑鼠】轉動視角 | 【左鍵】開槍 | 【ESC】解鎖滑鼠</p>
  </div>

  <script>
    // --- 1. 初始化 3D 場景與攝影機 ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);
    scene.fog = new THREE.FogExp2(0x1a1a24, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- 2. 燈光配置 ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(30, 50, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- 3. 第一人稱控制器 ---
    const controls = new THREE.PointerLockControls(camera, document.body);
    const instructions = document.getElementById('instructions');
    const titleText = document.getElementById('title-text');
    const subText = document.getElementById('sub-text');
    const damageOverlay = document.getElementById('damage-overlay');

    let playerHp = 100;
    let score = 0;
    let isGameOver = false;

    instructions.addEventListener('click', () => {
      if (isGameOver) restartGame();
      controls.lock();
    });

    controls.addEventListener('lock', () => instructions.style.display = 'none');
    controls.addEventListener('unlock', () => {
      if (!isGameOver) instructions.style.display = 'flex';
    });
    scene.add(controls.getObject());

    // --- 4. 場景地圖搭建 ---
    const floorGeo = new THREE.PlaneGeometry(300, 300);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // 隨機掩體（木箱）
    const boxGeo = new THREE.BoxGeometry(4, 4, 4);
    const boxMat = new THREE.MeshStandardMaterial({ color: 0x4a3c31 });
    for (let i = 0; i < 20; i++) {
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.x = (Math.random() - 0.5) * 140;
      box.position.z = (Math.random() - 0.5) * 140;
      box.position.y = 2;
      box.castShadow = true;
      box.receiveShadow = true;
      scene.add(box);
    }

    // --- 5. 綁定玩家槍枝模型與槍口火花 ---
    const gunGroup = new THREE.Group();
    const gunBodyGeo = new THREE.BoxGeometry(0.2, 0.25, 1.2);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.8, roughness: 0.2 });
    const gunBody = new THREE.Mesh(gunBodyGeo, gunMat);
    gunGroup.add(gunBody);

    const flashLight = new THREE.PointLight(0xffaa00, 0, 8);
    flashLight.position.set(0, 0.05, -0.7);
    gunGroup.add(flashLight);

    gunGroup.position.set(0.35, -0.35, -0.6);
    camera.add(gunGroup);

    // --- 6. 生成敵人的 AI 邏輯 ---
    const targets = [];

    function createTarget() {
      const targetGeo = new THREE.BoxGeometry(2.5, 4.5, 2.5);
      const targetMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
      const target = new THREE.Mesh(targetGeo, targetMat);
      
      // 生成在距離玩家稍微有段距離的地方
      const angle = Math.random() * Math.PI * 2;
      const distance = 30 + Math.random() * 40;
      target.position.x = controls.getObject().position.x + Math.sin(angle) * distance;
      target.position.z = controls.getObject().position.z + Math.cos(angle) * distance;
      target.position.y = 2.25;
      target.castShadow = true;
      
      // 敵人屬性：血量、移動速度、上次攻擊時間
      target.userData = { 
        health: 2, 
        speed: 3 + Math.random() * 2, 
        lastAttack: 0 
      };
      
      scene.add(target);
      targets.push(target);
    }

    // 初始化 5 個敵人
    for (let i = 0; i < 5; i++) createTarget();

    // --- 7. 射擊機制 ---
    const raycaster = new THREE.Raycaster();
    
    window.addEventListener('mousedown', (e) => {
      if (!controls.isLocked || e.button !== 0 || isGameOver) return;

      flashLight.intensity = 5;
      setTimeout(() => flashLight.intensity = 0, 40);

      gunGroup.position.z = -0.45;
      gunGroup.rotation.x = 0.1;
      setTimeout(() => {
        gunGroup.position.z = -0.6;
        gunGroup.rotation.x = 0;
      }, 60);

      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const intersects = raycaster.intersectObjects(targets);

      if (intersects.length > 0) {
        const hitObject = intersects[0].object;
        hitObject.userData.health -= 1;
        
        hitObject.material.color.setHex(0xffffff);
        setTimeout(() => hitObject.material.color.setHex(0xe74c3c), 80);

        if (hitObject.userData.health <= 0) {
          scene.remove(hitObject);
          targets.splice(targets.indexOf(hitObject), 1);
          score += 1;
          document.getElementById('score').innerText = score;
          setTimeout(createTarget, 1000);
        }
      }
    });

    // --- 8. 扣血與 Game Over 處理 ---
    function takeDamage(amount) {
      if (isGameOver) return;
      playerHp -= amount;
      if (playerHp < 0) playerHp = 0;
      document.getElementById('hp').innerText = playerHp;

      // 受傷畫面閃紅
      damageOverlay.style.opacity = '1';
      setTimeout(() => damageOverlay.style.opacity = '0', 200);

      // 玩家死亡
      if (playerHp <= 0) {
        isGameOver = true;
        controls.unlock();
        titleText.innerText = "GAME OVER";
        titleText.style.color = "#ff4757";
        subText.innerText = `最終擊殺數：${score} | 點擊畫面重新開始`;
        instructions.style.display = 'flex';
      }
    }

    function restartGame() {
      playerHp = 100;
      score = 0;
      isGameOver = false;
      document.getElementById('hp').innerText = playerHp;
      document.getElementById('score').innerText = score;
      titleText.style.color = "#ffffff";
      
      // 清空舊敵人並重新生成
      targets.forEach(target => scene.remove(target));
      targets.length = 0;
      for (let i = 0; i < 5; i++) createTarget();
      
      // 玩家重置位置
      controls.getObject().position.set(0, 1.6, 0);
    }

    // --- 9. 移動控制邏輯 ---
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let prevTime = performance.now();

    document.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyD') moveRight = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyD') moveRight = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- 10. 主遊戲迴圈 (含 AI 追蹤邏輯) ---
    function animate() {
      requestAnimationFrame(animate);

      const time = performance.now();
      if (controls.isLocked && !isGameOver) {
        const delta = (time - prevTime) / 1000;

        // 玩家移動
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 350.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 350.0 * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        controls.getObject().position.y = 1.6;

        const playerPos = controls.getObject().position;

        // 敵人 AI 追蹤與攻擊邏輯
        targets.forEach(target => {
          // 讓敵人面向玩家
          target.lookAt(playerPos.x, target.position.y, playerPos.z);

          // 計算與玩家的距離
          const dist = target.position.distanceTo(playerPos);

          if (dist > 2.5) {
            // 朝玩家方向移動
            target.translateZ(target.userData.speed * delta);
          } else {
            // 距離小於 2.5 進行攻擊（每 1 秒扣 10 HP）
            if (time - target.userData.lastAttack > 1000) {
              takeDamage(10);
              target.userData.lastAttack = time;
            }
          }
        });
      }

      prevTime = time;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
