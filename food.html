<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍱 嶺東周邊美食地圖</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --sub-text: #94a3b8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(129, 140, 248, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    .nav-tabs {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 0.4rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .nav-btn {
      flex: 1;
      padding: 0.65rem 0.2rem;
      text-align: center;
      color: var(--sub-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
      border-radius: 10px;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .nav-select-wrapper {
      display: none;
      margin-bottom: 1.5rem;
    }

    .nav-select {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--primary);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%38bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2rem;
    }

    .nav-select option {
      background: #0f172a;
      color: var(--text);
      padding: 0.5rem;
    }

    @media (max-width: 640px) {
      .nav-tabs {
        display: none;
      }
      .nav-select-wrapper {
        display: block;
      }
      .food-card {
        flex-direction: column;
        align-items: flex-start;
      }
      .food-link {
        width: 100%;
        text-align: center;
      }
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--sub-text);
      font-size: 0.9rem;
    }

    .food-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.25rem;
      margin-bottom: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .food-card:hover {
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateY(-2px);
    }

    .food-info h3 {
      font-size: 1.1rem;
      color: var(--primary);
      margin-bottom: 0.4rem;
      font-weight: 700;
    }

    .food-info p {
      font-size: 0.88rem;
      color: var(--sub-text);
      margin-bottom: 0.6rem;
      line-height: 1.5;
    }

    .tag {
      display: inline-block;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--primary);
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      font-weight: 600;
    }

    .food-link {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0f172a;
      text-decoration: none;
      padding: 0.6rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 0.2s, box-shadow 0.2s;
    }

    .food-link:hover {
      opacity: 0.9;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--card-border);
      color: var(--sub-text);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="nav-tabs">
      <a href="index.html" class="nav-btn">📦 入住清單</a>
      <a href="notice.html" class="nav-btn">📢 宿舍須知</a>
      <a href="map.html" class="nav-btn">🏫 校區地圖</a>
      <a href="food.html" class="nav-btn active">🍱 周邊美食</a>
      <a href="life.html" class="nav-btn">🚌 交通生活</a>
    </nav>

    <div class="nav-select-wrapper">
      <select class="nav-select" onchange="location = this.value;">
        <option value="index.html">📦 入住清單</option>
        <option value="notice.html">📢 宿舍須知</option>
        <option value="map.html">🏫 校區地圖</option>
        <option value="food.html" selected>🍱 周邊美食</option>
        <option value="life.html">🚌 交通生活</option>
      </select>
    </div>

    <header>
      <h1>🍱 嶺東商圈與周邊美食推薦</h1>
      <p class="subtitle">精選嶺東科大學生最愛的平價美食與必吃店家！</p>
    </header>

    <div class="food-card">
      <div class="food-info">
        <h3>📍 嶺東路/建功路便當巷</h3>
        <p>正餐首選！各式平價便當、快炒與火鍋料理集散地。</p>
        <span class="tag">平價正餐</span>
      </div>
      <a href="https://www.google.com/maps/search/%E5%8F%B0%E4%B8%AD%E5%B6%BA%E6%9D%B1%E7%BE%8E%E9%A3%9F" target="_blank" class="food-link">導航前往</a>
    </div>

    <div class="food-card">
      <div class="food-info">
        <h3>🥪 嶺東後門早午餐街</h3>
        <p>西式早餐、粉漿蛋餅、大份量漢堡，上課前的能量來源。</p>
        <span class="tag">活力早餐</span>
      </div>
      <a href="https://www.google.com/maps/search/%E5%B6%BA%E6%9D%B1%E7%A7%91%E6%8A%80%E5%A4%A7%E5%AD%B8%20%E6%97%A9%E5%8D%88%E9%A4%90" target="_blank" class="food-link">導航前往</a>
    </div>

    <div class="food-card">
      <div class="food-info">
        <h3>🧋 忠勇路手搖飲料街</h3>
        <p>各大連鎖飲料店一應俱全，宵夜炸雞鹹酥雞集中地。</p>
        <span class="tag">下午茶宵夜</span>
      </div>
      <a href="https://www.google.com/maps/search/%E5%8F%B0%E4%B8%AD%E5%BF%A0%E5%8B%87%E8%B7%AF%E9%80%B2%20%E9%83%B5%E5%B1%80%E9%96%B1" target="_blank" class="food-link">導航前往</a>
    </div>

    <footer>
      <p>Made with ❤️ by <strong>愷</strong></p>
    </footer>
  </div>

</body>
</html>
