<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏫 嶺東校區地圖</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --sub-text: #94a3b8;
      --primary: #38bdf8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .nav-tabs {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 0.4rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .nav-btn {
      flex: 1;
      padding: 0.65rem 0.2rem;
      text-align: center;
      color: var(--sub-text);
      text-decoration: none;
      font-weight: bold;
      font-size: 0.82rem;
      border-radius: 8px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #0f172a;
    }

    header {
      text-align: center;
      margin-bottom: 1.2rem;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--sub-text);
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: bold;
      margin: 1rem 0 0.5rem 0;
    }

    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    .map-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }

    .map-btn:hover, .map-btn.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
    }

    .map-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      height: 400px;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--sub-text);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="nav-tabs">
      <a href="./" class="nav-btn">📦 入住清單</a>
      <a href="notice.html" class="nav-btn">📢 宿舍須知</a>
      <a href="map.html" class="nav-btn active">🏫 校區地圖</a>
      <a href="food.html" class="nav-btn">🍱 周邊美食</a>
    </nav>

    <header>
      <h1>🏫 嶺東科技大學 雙校區導航</h1>
      <p class="subtitle">點擊下方按鈕，直接在下方地圖切換校區與生活設施！</p>
    </header>

    <div class="section-title">📍 校區地點</div>
    <div class="quick-links">
      <button class="map-btn selected" onclick="locateMap('嶺東科技大學春安校區', this)">🏫 春安校區 (本校區)</button>
      <button class="map-btn" onclick="locateMap('嶺東科技大學寶文校區', this)">🏢 寶文校區 (二校區)</button>
    </div>

    <div class="section-title">🏪 學校周邊生活設施</div>
    <div class="quick-links">
      <button class="map-btn" onclick="locateMap('台中市南屯區建功路 便利商店', this)">🏪 建功路便利商店</button>
      <button class="map-btn" onclick="locateMap('台中市南屯區嶺東路24號', this)">📦 蝦皮智取店 (南屯嶺東)</button>
    </div>

    <div class="map-container">
      <iframe 
        id="map-iframe"
        src="https://maps.google.com/maps?q=%E5%B6%BA%E6%9D%B1%E7%A7%91%E6%8A%80%E5%A4%A7%E5%AD%B8%E6%98%A5%E5%AE%89%E6%A0%A1%E5%8D%80&t=&z=16&ie=UTF8&iwloc=&output=embed" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <footer>
      <p>Made with ❤️ by <strong>愷</strong></p>
    </footer>
  </div>

  <script>
    function locateMap(query, btnElement) {
      const iframe = document.getElementById('map-iframe');
      iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
      document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('selected'));
      btnElement.classList.add('selected');
    }
  </script>

</body>
</html>
