<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏫 嶺東校區地圖</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --sub-text: #94a3b8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(129, 140, 248, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    .nav-tabs {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 0.4rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .nav-btn {
      flex: 1;
      padding: 0.65rem 0.2rem;
      text-align: center;
      color: var(--sub-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82rem;
      border-radius: 10px;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .nav-select-wrapper {
      display: none;
      margin-bottom: 1.5rem;
    }

    .nav-select {
      width: 100%;
      padding: 0.85rem 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--primary);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%38bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 1rem center;
      background-size: 1.2rem;
    }

    .nav-select option {
      background: #0f172a;
      color: var(--text);
      padding: 0.5rem;
    }

    @media (max-width: 640px) {
      .nav-tabs {
        display: none;
      }
      .nav-select-wrapper {
        display: block;
      }
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--sub-text);
      font-size: 0.9rem;
    }

    .section-title {
      font-size: 0.95rem;
      color: var(--primary);
      font-weight: 700;
      margin: 1.2rem 0 0.6rem 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quick-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }

    .map-btn {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 0.85rem 0.5rem;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: all 0.25s ease;
      outline: none;
    }

    .map-btn:hover {
      border-color: rgba(56, 189, 248, 0.4);
      background: rgba(56, 189, 248, 0.08);
      transform: translateY(-2px);
    }

    .map-btn.selected {
      border-color: var(--primary);
      background: rgba(56, 189, 248, 0.18);
      color: var(--primary);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .map-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 1.5rem;
      height: 380px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--card-border);
      color: var(--sub-text);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="nav-tabs">
      <a href="index.html" class="nav-btn">📦 入住清單</a>
      <a href="notice.html" class="nav-btn">📢 宿舍須知</a>
      <a href="map.html" class="nav-btn active">🏫 校區地圖</a>
      <a href="food.html" class="nav-btn">🍱 周邊美食</a>
      <a href="life.html" class="nav-btn">🚌 交通生活</a>
    </nav>

    <div class="nav-select-wrapper">
      <select class="nav-select" onchange="location = this.value;">
        <option value="index.html">📦 入住清單</option>
        <option value="notice.html">📢 宿舍須知</option>
        <option value="map.html" selected>🏫 校區地圖</option>
        <option value="food.html">🍱 周邊美食</option>
        <option value="life.html">🚌 交通生活</option>
      </select>
    </div>

    <header>
      <h1>🏫 嶺東科技大學 雙校區導航</h1>
      <p class="subtitle">點擊按鈕可在地圖中直接切換校區與生活設施！</p>
    </header>

    <div class="section-title">📍 校區地點</div>
    <div class="quick-links">
      <button class="map-btn selected" onclick="locateMap('嶺東科技大學春安校區', this)">🏫 春安校區 (本校區)</button>
      <button class="map-btn" onclick="locateMap('嶺東科技大學寶文校區', this)">🏢 寶文校區 (二校區)</button>
    </div>

    <div class="section-title">🏪 學校周邊生活設施</div>
    <div class="quick-links">
      <button class="map-btn" onclick="locateMap('台中市南屯區建功路 便利商店', this)">🏪 建功路便利商店</button>
      <button class="map-btn" onclick="locateMap('台中市南屯區嶺東路24號', this)">📦 蝦皮智取店 (南屯嶺東)</button>
    </div>

    <div class="map-container">
      <iframe 
        id="map-iframe"
        src="https://maps.google.com/maps?q=%E5%B6%BA%E6%9D%B1%E7%A7%91%E6%8A%80%E5%A4%A7%E5%AD%B8%E6%98%A5%E5%AE%89%E6%A0%A1%E5%8D%80&t=&z=16&ie=UTF8&iwloc=&output=embed" 
        allowfullscreen="" 
        loading="lazy" 
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <footer>
      <p>Made with ❤️ by <strong>愷</strong></p>
    </footer>
  </div>

  <script>
    function locateMap(query, btnElement) {
      const iframe = document.getElementById('map-iframe');
      iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=16&ie=UTF8&iwloc=&output=embed`;
      document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('selected'));
      btnElement.classList.add('selected');
    }
  </script>

</body>
</html>
