<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 嶺東宿舍入住清單</title>
  <style>
    :root {
      --bg: #0b1329;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --sub-text: #94a3b8;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.25);
      --accent: #818cf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 20% 20%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(129, 140, 248, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      max-width: 680px;
      width: 100%;
    }

    .nav-tabs {
      display: flex;
      gap: 0.3rem;
      margin-bottom: 2rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      padding: 0.4rem;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .nav-btn {
      flex: 1;
      padding: 0.65rem 0.1rem;
      text-align: center;
      color: var(--sub-text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.8rem;
      border-radius: 10px;
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .nav-btn:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #0f172a;
      font-weight: 700;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      color: var(--sub-text);
      font-size: 0.92rem;
    }

    .category {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.2rem;
      margin-bottom: 1.2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .category:hover {
      border-color: rgba(56, 189, 248, 0.3);
    }

    .category-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .item-list {
      list-style: none;
    }

    .item {
      display: flex;
      align-items: center;
      padding: 0.65rem 0.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 8px;
      transition: background 0.2s;
    }

    .item:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .item:last-child {
      border-bottom: none;
    }

    .item input[type="checkbox"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--sub-text);
      border-radius: 6px;
      margin-right: 0.9rem;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      background: transparent;
    }

    .item input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }

    .item input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #0f172a;
      font-size: 14px;
      font-weight: bold;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .item label {
      cursor: pointer;
      font-size: 0.95rem;
      flex: 1;
      transition: color 0.2s;
    }

    .item input[type="checkbox"]:checked + label {
      text-decoration: line-through;
      color: var(--sub-text);
      opacity: 0.6;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--card-border);
      color: var(--sub-text);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <nav class="nav-tabs">
      <a href="index.html" class="nav-btn active">📦 入住清單</a>
      <a href="notice.html" class="nav-btn">📢 宿舍須知</a>
      <a href="map.html" class="nav-btn">🏫 校區地圖</a>
      <a href="food.html" class="nav-btn">🍱 周邊美食</a>
      <a href="life.html" class="nav-btn">🚌 交通生活</a>
    </nav>

    <header>
      <h1>📦 嶺東宿舍入住準備清單</h1>
      <p class="subtitle">勾選已準備物品，進度將自動保存於此設備中！</p>
    </header>

    <div id="checklist"></div>

    <footer>
      <p>Made with ❤️ by <strong>愷</strong></p>
    </footer>
  </div>

  <script>
    const checklistData = [
      {
        category: "📄 重要證件與文件",
        items: ["身分證正本與影本", "健保卡", "印章", "宿舍入住通知書/繳費收據", "大頭照數張 (備用)"]
      },
      {
        category: "🛏️ 床寢與生活用品",
        items: ["床墊 (建議尺寸先確認)", "被子 / 薄被", "枕頭", "床單 / 枕頭套", "延長線 (建議帶防載斷電型)", "衣架與曬衣夾"]
      },
      {
        category: "🧴 個人清潔與衛浴",
        items: ["洗髮精 / 沐浴乳", "牙刷 / 牙膏 / 漱口杯", "毛巾 / 浴巾", "洗衣精 / 洗衣袋", "臉盆 / 澡籃 (攜帶盥洗用品用)", "吹風機"]
      },
      {
        category: "💻 學習與電子產品",
        items: ["筆記型電腦 / 電源線", "手機充電器 / 行動電源", "網路線 (部分宿舍需自備)", "多孔插座 / 轉接頭"]
      },
      {
        category: "💊 常用藥品與雜項",
        items: ["個人常備藥物 (感冒、腸胃、止痛)", "口罩", "衛生紙 / 濕紙巾", "環保餐具 / 水壺"]
      }
    ];

    const checklistContainer = document.getElementById('checklist');

    function renderChecklist() {
      checklistContainer.innerHTML = '';
      checklistData.forEach((cat, catIdx) => {
        const catDiv = document.createElement('div');
        catDiv.className = 'category';
        
        let itemsHTML = cat.items.map((item, itemIdx) => {
          const key = `item_${catIdx}_${itemIdx}`;
          const isChecked = localStorage.getItem(key) === 'true' ? 'checked' : '';
          return `
            <li class="item">
              <input type="checkbox" id="${key}" ${isChecked} onchange="toggleCheck('${key}')">
              <label for="${key}">${item}</label>
            </li>
          `;
        }).join('');

        catDiv.innerHTML = `
          <div class="category-title">${cat.category}</div>
          <ul class="item-list">${itemsHTML}</ul>
        `;
        checklistContainer.appendChild(catDiv);
      });
    }

    function toggleCheck(key) {
      const checkbox = document.getElementById(key);
      localStorage.setItem(key, checkbox.checked);
    }

    renderChecklist();
  </script>

</body>
</html>
